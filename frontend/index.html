<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Local comic reader library">
<title>Comic Reader</title>
<link rel="preconnect" href="https://cdn.asurascans.com">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>
  // Reader deep link: paint the reader's black background from the first frame instead
  // of flashing the library while data loads. App removes the class once ready.
  if (location.hash.startsWith("#/read/")) document.documentElement.classList.add("boot-read");
</script>
<style>html.boot-read body { background: #0b0b0b; } html.boot-read #root { visibility: hidden; }</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
