<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Local comic reader library">
<title>Comic Reader</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
<script>
  // Reader deep link: show the (black) reader overlay from first paint instead of
  // flashing the library shell while settings/library/chapter load. Cleared by the router.
  if (location.hash.startsWith("#/read/")) document.documentElement.classList.add("boot-read");
</script>
</head>
<body>
<nav class="nav" id="nav">
  <a class="logo" href="#/">COMICFLIX</a>
  <div class="search-wrap">
    <button class="search-toggle" id="search-toggle" type="button" aria-label="Search" title="Search">⌕</button>
    <input id="search" type="search" placeholder="Search titles" autocomplete="off">
  </div>
  <a class="iconbtn" id="downloadsbtn" href="#/downloads" title="Downloads" aria-label="Downloads">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0 0-5-5m5 5 5-5M4 20h16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </a>
  <a class="iconbtn" id="remotebtn" href="#/remote" title="Remote control another screen" aria-label="Remote control">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="8" r="2" fill="currentColor"/><path d="M10 14h4M10 17h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </a>
  <button class="installbtn hidden" id="installbtn" type="button" title="Install Comicflix as an app">⤓ Install</button>
  <button class="addbtn" id="addbtn">+ Add Comic</button>
</nav>
<div id="offline" class="offline-banner hidden">You're offline — showing cached library when available</div>
<main id="home"></main>
<main id="series" class="series-page hidden"></main>
<div id="modal" class="modal hidden"></div>
<div id="ingest" class="modal hidden" style="z-index:50"></div>
<div id="tray" class="tray hidden"><div class="thead" id="thead"></div><div class="tbody" id="tbody"></div></div>
<div id="toast" class="toast hidden"></div>
<div id="reader" class="reader hidden"></div>
<div id="remote" class="remote hidden"></div>
<div id="login" class="login hidden">
  <form class="login-card" id="login-form">
    <div class="logo">COMICFLIX</div>
    <input type="text" name="username" value="me" autocomplete="username" hidden>
    <div class="login-field">
      <input type="password" id="login-pin" name="password" placeholder="PIN" inputmode="numeric" size="8"
             pattern="[0-9]*" autocomplete="current-password" aria-label="PIN" required>
      <button type="button" class="login-eye" id="login-eye" aria-label="Show PIN" title="Show PIN">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path class="slash" d="M4 4l16 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <button type="submit" class="addbtn">Sign in</button>
    <p class="login-err" id="login-err"></p>
  </form>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
